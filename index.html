<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria bella Napoli</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Nasconde le schede non attive */
        .tm-tab-content {
            display: none;
        }

        .tm-tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="tm-header">
            <div class="tm-header-inner">
                <span class="tm-site-icon">☕</span>
                <h1 class="tm-site-title">Pizzeria bella Napoli</h1>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tm-nav">
            <ul class="tm-nav-ul">
                <li class="tm-nav-li"><a href="#Pizze" class="tm-nav-link active"
                        onclick="openTab(event, 'Pizze')">Pizze</a></li>
                <li class="tm-nav-li"><a href="#Dolci" class="tm-nav-link" onclick="openTab(event, 'Dolci')">Dolci</a>
                </li>
                <li class="tm-nav-li"><a href="#Bevande" class="tm-nav-link"
                        onclick="openTab(event, 'Bevande')">Bevande</a></li>
            </ul>
        </nav>

        <!-- Menu Content -->
        <div class="tm-section">

            <!-- elenco pizze -->
            <div id="Pizze" class="tm-tab-content active">
                <div class="tm-list">
                    <!-- Gli studenti aggiungeranno qui le pizze -->
                    <div class="tm-list-item">

                    </div>
                </div>
            </div>

            <!-- elenco dolci -->

            <div class="tm-list-item">
                <img src="img/12958638_s-1.webp" alt="Image" class="tm-list-item-img">
                <h3> tiramisu <span class="tm-list-item-price">&euro;3</span></h3>
            </div>
        </div>
        <div class="tm-list">
            <div class="tm-list-item">
                <img src="img/triangoli-dolci-e-fritti-ricetta-ho-voglia-di-dolce.jpg" alt="Image"
                    class="tm-list-item-img">
                <h3> dolci fritti <span class="tm-list-item-price">&euro;3.5</span></h3>
            </div>
        </div>



        <!-- elenco bevande -->
        <div id="Bevande" class="tm-tab-content">
            <div class="tm-list">
                <div class="tm-list-item">
                    <img src="img/espresso.png" alt="Image" class="tm-list-item-img">

                    <h3 class="tm-list-item-name">Caff&egrave; Espresso <span
                            class="tm-list-item-price">&euro;2.50</span></h3>
                    <p class="tm-list-item-description">Miscela arabica di qualit&agrave; superiore. </p>
                </div>
            </div>
        </div>
    </div>

    </div>
    <!-- end Menu Page -->
    </div>

    <script>
        function openTab(evt, tabName) {
            evt.preventDefault();
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tm-tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tm-nav-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>

</html>
